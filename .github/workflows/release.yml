name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "openapi.json" }
      - run: gh release create "$GITHUB_REF_NAME" "openapi.json" --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
