name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npx --yes @redocly/cli@1 lint openapi.json --format=summary || true
      - run: node -e "for (const f of ['openapi.json','fixtures/webhook-vectors.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
